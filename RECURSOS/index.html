<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Estudio - AntiGravity</title>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for code highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --border-color: #334155;
            --hover-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styling */
        #sidebar {
            width: 320px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(135deg, #1e293b, #0f172a);
        }

        .sidebar-header h2 {
            font-size: 1.2rem;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-tree {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .folder {
            margin-bottom: 10px;
        }

        .folder-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #94a3b8;
            margin: 8px 0 4px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .file-item {
            padding: 8px 12px;
            margin: 2px 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #cbd5e1;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .file-item:hover {
            background-color: var(--hover-color);
            color: #ffffff;
        }

        .file-item.active {
            background-color: #0284c7;
            color: #ffffff;
            font-weight: 500;
        }

        /* Main Content View */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-header {
            padding: 15px 30px;
            background-color: var(--sidebar-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .current-path {
            font-size: 0.9rem;
            color: var(--accent-color);
            font-weight: 600;
        }

        #markdown-view {
            flex: 1;
            padding: 40px 60px;
            overflow-y: auto;
            max-width: 950px;
            margin: 0 auto;
            width: 100%;
            line-height: 1.7;
        }

        /* Markdown Custom Styling */
        #markdown-view h1, #markdown-view h2, #markdown-view h3 {
            color: #38bdf8;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.3em;
        }

        #markdown-view p {
            margin-bottom: 1.2em;
            font-size: 1.05rem;
        }

        #markdown-view img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            margin: 20px 0;
            display: block;
        }

        #markdown-view ul, #markdown-view ol {
            margin-left: 20px;
            margin-bottom: 1.2em;
        }

        #markdown-view blockquote {
            border-left: 4px solid var(--accent-color);
            padding-left: 15px;
            color: #94a3b8;
            font-style: italic;
            margin: 15px 0;
        }

        #markdown-view table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        #markdown-view th, #markdown-view td {
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            text-align: left;
        }

        #markdown-view th {
            background-color: var(--sidebar-bg);
            color: var(--accent-color);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <h2>🚀 AntiGravity Viewer</h2>
        </div>
        <div class="file-tree" id="file-tree">
            <!-- Files will be loaded dynamically -->
        </div>
    </div>

    <div id="main-content">
        <div class="content-header">
            <span class="current-path" id="current-path">Selecciona un archivo .md para leer</span>
        </div>
        <div id="markdown-view">
            <h1>Bienvenido a tu Visualizador de Estudio 📚</h1>
            <p>Selecciona cualquier archivo <code>.md</code> o temario en el panel de la izquierda para verlo perfectamente formateado con sus <strong>imágenes reales</strong>, listas y preguntas.</p>
        </div>
    </div>

    <script>
        async function loadFileTree() {
            try {
                const response = await fetch('/api/files');
                const data = await response.json();
                const container = document.getElementById('file-tree');
                container.innerHTML = '';

                for (const [folder, files] of Object.entries(data)) {
                    if (files.length === 0) continue;
                    
                    const folderDiv = document.createElement('div');
                    folderDiv.className = 'folder';

                    const folderTitle = document.createElement('div');
                    folderTitle.className = 'folder-title';
                    folderTitle.textContent = folder === '.' ? '📁 ARCHIVOS PRINCIPALES' : `📁 ${folder}`;
                    folderDiv.appendChild(folderTitle);

                    files.forEach(file => {
                        const fileItem = document.createElement('div');
                        fileItem.className = 'file-item';
                        fileItem.innerHTML = `📄 ${file.name}`;
                        fileItem.onclick = () => loadMarkdown(file.path, fileItem);
                        folderDiv.appendChild(fileItem);
                    });

                    container.appendChild(folderDiv);
                }
            } catch (err) {
                console.error('Error al cargar la lista de archivos:', err);
            }
        }

        async function loadMarkdown(path, element) {
            document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');

            document.getElementById('current-path').textContent = path;

            try {
                const response = await fetch('/' + path);
                const text = await response.text();
                document.getElementById('markdown-view').innerHTML = marked.parse(text);
                hljs.highlightAll();
            } catch (err) {
                document.getElementById('markdown-view').innerHTML = `<p style="color:red;">Error al cargar el archivo: ${err}</p>`;
            }
        }

        loadFileTree();
    </script>
</body>
</html>
